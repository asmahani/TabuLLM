name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Sphinx site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package with docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build HTML docs (warnings as errors)
        # -W promotes every Sphinx warning (broken cross-reference, malformed
        # docstring markup, autodoc import failure, ...) to a build failure.
        run: python -m sphinx -b html -W docs docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only main pushes deploy; pull requests only build, per the acceptance
    # criteria in issue #33.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install package with docs dependencies
        run: python -m pip install -e ".[docs]"

      - name: Build HTML docs
        run: python -m sphinx -b html docs docs/_build/html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
