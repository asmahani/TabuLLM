name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: test (${{ matrix.python-version }}, langchain-core ${{ matrix.langchain_core_target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        # Test the oldest supported minor line and the newest version
        # admitted by pyproject.toml. Dependabot cap-widening PRs therefore
        # exercise the newly admitted release without a matrix edit.
        langchain_core_target: ["minimum-line", "latest-allowed"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install minimum supported LangChain core line
        if: matrix.langchain_core_target == 'minimum-line'
        run: python -m pip install "langchain-core==1.3.*"

      - name: Validate and report dependency environment
        run: |
          python -m pip check
          python -c "import langchain_core; print(f'langchain-core=={langchain_core.__version__}')"

      - name: Run tests
        run: pytest tests/ --tb=short --cov=tabullm --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          use_oidc: true
